<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyMoney V7.0 安全初始化</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;background:#f1f5f9;color:#15253d;margin:0;padding:20px}main{max-width:700px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 28px #0001}h1{font-size:1.5rem;margin:0 0 12px}h2{font-size:1.05rem}p,li{line-height:1.7}button{padding:13px 16px;border:0;border-radius:9px;background:#2459a6;color:white;font-size:1rem;cursor:pointer;margin:5px 5px 5px 0}button:disabled{background:#9aa7b8;cursor:not-allowed}.danger{background:#b42318}pre{white-space:pre-wrap;word-break:break-word;background:#f1f5f9;padding:12px;border-radius:8px;font-size:.9rem}label{display:block;margin:13px 0}input[type=text]{width:100%;padding:12px;border:1px solid #9aa7b8;border-radius:8px;font-size:1rem}.note{border-left:4px solid #b45309;padding:10px;background:#fffbeb}.good{border-left:4px solid #15803d;padding:10px;background:#f0fdf4}a{color:#2459a6}</style></head><body><main><h1>MyMoney V7.0 — 安全初始化工具</h1><p>仅供清除本浏览器中 <strong>正式网站</strong> 的 MyMoney 测试资料。不会清除其他网站的数据，也不会修改 GitHub 文件。</p><p class="note" id="site"></p><h2>1. 检查将清除的资料</h2><p>下列项目来自 V7.0 程序已确认的本机储存键。请先核对。</p><pre id="inventory">正在检查…</pre><p id="unexpected"></p><h2>2. 下载额外保护备份</h2><p>此备份包含账本、PIN 设置（散列资料）、偏好、模板、定期账单和快照。请妥善保管，<strong>不要上传公开 GitHub</strong>。</p><button id="backup">下载初始化前完整储存备份</button><p id="backupMsg"></p><h2>3. 最后确认并清空</h2><label><input type="checkbox" id="confirmBackup"> 我已下载并确认保护备份保存在设备上</label><label><input type="checkbox" id="confirmData"> 我确认正式网站的现有记录都是测试数据，允许永久清除</label><label>请输入 <strong>清空测试资料</strong> 以确认<input id="phrase" type="text" autocomplete="off" placeholder="清空测试资料"></label><button class="danger" id="reset" disabled>清空正式网站的 MyMoney 测试资料</button><p id="status" aria-live="polite"></p><p><a href="./index.html">返回 MyMoney 正式网站</a></p></main><script>
(()=>{'use strict';
const keys=['mymoney-local-v1','mymoney-v60-theme','mymoney-v604-preferences','mymoney-v604-settings','mymoney-v610-security','mymoney-v630-snapshots','mymoney-v640-templates','mymoney-v650-bills'];
const $=id=>document.getElementById(id);let downloaded=false,completed=false;
const validHost=location.protocol==='https:'&&location.hostname.toLowerCase()==='docm6180.github.io'&&location.pathname==='/my-money-book/initialize-v7.html';
$('site').textContent=validHost?'当前地址：'+location.origin+location.pathname+'。只会处理此正式网站的储存空间。':'安全限制：请把本页面上传到正式仓库根目录，并通过 https://docm6180.github.io/my-money-book/initialize-v7.html 打开。其他地址禁止执行。';
function list(){return keys.map(k=>({key:k,present:localStorage.getItem(k)!==null,bytes:(localStorage.getItem(k)||'').length}));}
function update(){try{const items=list();$('inventory').textContent=items.map(x=>(x.present?'存在':'不存在')+' | '+x.key+(x.present?' | '+x.bytes+' 字符':'' )).join('\n');const other=Object.keys(localStorage).filter(k=>k.startsWith('mymoney-')&&!keys.includes(k));$('unexpected').textContent=other.length?'注意：发现未识别的 MyMoney 储存项目：'+other.join('、')+'。为防止误删，本工具不会清除这些项目。':'没有发现额外的 MyMoney 储存键。';}catch(e){$('inventory').textContent='无法读取本地储存：'+e.message;}}
function enabled(){return validHost&&downloaded&&!completed&&$('confirmBackup').checked&&$('confirmData').checked&&$('phrase').value.trim()==='清空测试资料'}
function sync(){$('reset').disabled=!enabled()}
for(const id of ['confirmBackup','confirmData','phrase'])$(id).addEventListener('input',sync);
$('backup').addEventListener('click',()=>{if(!validHost)return;try{const entries={};for(const k of keys)entries[k]=localStorage.getItem(k);const pack={format:'MyMoney-PreInitialization-Storage-Backup',version:1,origin:location.origin,path:'/my-money-book/',exportedAt:new Date().toISOString(),entries};const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MyMoney_V7_Before_Initialize_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);downloaded=true;$('backupMsg').textContent='已请求浏览器下载保护备份。请检查下载文件确实存在，再勾选确认。';sync()}catch(e){$('backupMsg').textContent='无法生成备份，禁止清空：'+e.message}});
$('reset').addEventListener('click',()=>{if(!enabled())return;if(!confirm('最后确认：这将永久清除正式网站上的账本、PIN、模板、账单、快照及设置。测试网站不受影响。是否继续？'))return;try{const original=Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]));const failures=[];for(const k of keys){try{localStorage.removeItem(k);if(localStorage.getItem(k)!==null)failures.push(k)}catch(e){failures.push(k)}}if(failures.length){for(const [k,v] of Object.entries(original)){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}$('status').className='note';$('status').textContent='部分储存项目清除失败，已尝试恢复原值。请勿开始正式记账，先检查备份。失败项目：'+failures.join('、');return}completed=true;$('status').className='good';$('status').textContent='已验证所有已知 MyMoney 测试资料储存键均不存在。请关闭其他 MyMoney 标签页，然后返回正式网站重新进行首次设置。';$('backup').disabled=true;sync();update()}catch(e){$('status').textContent='清除未完成：'+e.message}});
update();sync();})();
</script></body></html>
